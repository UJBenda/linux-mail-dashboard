name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mp_owner
          POSTGRES_PASSWORD: test
          POSTGRES_DB: mailpanel_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U mp_owner" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: PHP rozšíření
        run: sudo apt-get update -q && sudo apt-get install -y -q php8.3-cli php8.3-pgsql php8.3-ldap php8.3-mbstring php8.3-intl
      - name: Kontrola syntaxe
        run: find src tests public templates config bin -name '*.php' -o -path bin/mailpanel | xargs -n1 php -l > /dev/null
      - name: Testy
        env:
          MAILPANEL_TEST_DSN: pgsql:host=127.0.0.1;dbname=mailpanel_test
          MAILPANEL_TEST_USER: mp_owner
          MAILPANEL_TEST_PASSWORD: test
        run: php tests/run.php
