; Linux Mail Dashboard – vlastní PHP-FPM pool (ne www-data, oddělený od Roundcube/iRedAdmin)
; /etc/php/8.3/fpm/pool.d/mailpanel.conf

[mailpanel]
user = mailpanel
group = mailpanel
listen = /run/php/mailpanel.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

pm = ondemand
pm.max_children = 10
pm.process_idle_timeout = 60s
request_terminate_timeout = 60s

; vlastní úložiště session (ne sdílené s jinými aplikacemi)
php_admin_value[session.save_path] = /var/lib/mailpanel/sessions
php_admin_value[open_basedir] = /opt/mailpanel/:/etc/mailpanel/:/var/lib/mailpanel/:/tmp/
php_admin_value[disable_functions] = exec,passthru,shell_exec,system,proc_open,popen,pcntl_exec
php_admin_flag[expose_php] = off
php_admin_flag[display_errors] = off
php_admin_flag[log_errors] = on
php_admin_value[error_log] = /var/log/mailpanel/php-error.log
php_admin_flag[allow_url_fopen] = off
php_admin_value[upload_max_filesize] = 2M
php_admin_value[post_max_size] = 2M
