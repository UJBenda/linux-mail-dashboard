# /etc/rsyslog.d/90-mailpanel-forward.conf
# Kopie logů pošty a auditu panelu na centrální log server / SIEM (TCP + TLS).
# Mail server může být kompromitován – logy pro vyšetřování musí existovat i mimo něj.

global(DefaultNetstreamDriverCAFile="/etc/ssl/certs/siem-ca.pem")

if ($syslogfacility-text == "mail" or $syslogfacility-text == "authpriv"
    or $programname == "mailpanel") then {
    action(type="omfwd" target="siem.firma.local" port="6514" protocol="tcp"
           StreamDriver="gtls" StreamDriverMode="1" StreamDriverAuthMode="x509/name"
           StreamDriverPermittedPeers="siem.firma.local"
           queue.type="LinkedList" queue.filename="fwd_siem" queue.maxDiskSpace="1g"
           queue.saveOnShutdown="on" action.resumeRetryCount="-1")
}
