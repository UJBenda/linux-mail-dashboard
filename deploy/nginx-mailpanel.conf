# Linux Mail Dashboard – samostatný vhost jen pro vnitřní síť.
# /etc/nginx/sites-available/mailpanel.conf → symlink do sites-enabled
#
# NEPOUŽÍVEJTE veřejný hostname mail serveru (Roundcube/SOGo). Panel musí být
# dostupný jen ze správcovské sítě / VPN.

server {
    listen 10.0.0.10:8443 ssl;            # vnitřní adresa serveru
    http2 on;
    server_name mailpanel.firma.local;

    ssl_certificate     /etc/ssl/certs/mailpanel.crt;
    ssl_certificate_key /etc/ssl/private/mailpanel.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_tickets off;

    # jen správcovské sítě
    allow 10.0.50.0/24;                   # admin VLAN
    allow 10.8.0.0/24;                    # VPN
    deny  all;

    root /opt/mailpanel/public;
    index index.php;

    access_log /var/log/nginx/mailpanel.access.log;
    error_log  /var/log/nginx/mailpanel.error.log;

    client_max_body_size 2m;
    server_tokens off;

    location /assets/ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options nosniff;
    }

    location / {
        try_files $uri /index.php$is_args$args;
    }

    location = /index.php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param HTTPS on;
        fastcgi_pass unix:/run/php/mailpanel.sock;
    }

    # nic jiného než index.php se nespouští
    location ~ \.php$ { return 404; }
    location ~ /\. { deny all; }
}
